name: app-competidores

on:
  workflow_dispatch:
  push:
    # Con solo `tags`, GitHub no correría en pushes de ramas; las rutas no aplican a los tags
    branches: ["**"]
    tags: ["competidores-v*"]
    paths: ["apps/app-competidores/**", ".github/workflows/app-competidores.yml"]
  pull_request:
    paths: ["apps/app-competidores/**", ".github/workflows/app-competidores.yml"]

# Para publicar el release hay que poder crear releases con el GITHUB_TOKEN
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/app-competidores
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/app-competidores/requirements.txt
      - run: pip install -r requirements.txt

      - name: Pruebas
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Compilar .exe
        # assets va dentro del .exe (ícono de la ventana y la bandeja); --icon es el del ejecutable
        run: pyinstaller --onefile --windowed --noconfirm --name app-competidores --icon assets/gatito.ico --add-data "assets;assets" app.py

      - name: Tamaño del .exe
        shell: pwsh
        run: "'{0:N1} MB' -f ((Get-Item dist/app-competidores.exe).Length / 1MB)"

      # Si PyInstaller dejó fuera un módulo, el .exe se cierra al arrancar: debe seguir vivo a los 15 s
      - name: Prueba de arranque
        shell: pwsh
        run: |
          $app = Start-Process -FilePath dist/app-competidores.exe -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { Write-Error "El .exe se cerró al arrancar (código $($app.ExitCode))"; exit 1 }
          Stop-Process -Id $app.Id -Force
          Write-Output "El .exe arrancó y siguió abierto 15 s"

      - uses: actions/upload-artifact@v4
        with:
          name: app-competidores
          path: apps/app-competidores/dist/app-competidores.exe
          retention-days: 30

      # Con un tag competidores-v* el .exe se publica como GitHub Release (descarga directa, sin caducidad)
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/competidores-v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/app-competidores/dist/app-competidores.exe
          generate_release_notes: true
