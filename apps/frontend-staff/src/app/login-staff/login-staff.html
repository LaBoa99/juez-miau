<div class="login">
  <header class="login__bar">
    <span class="login__bar-brand">[OJ]</span>
  </header>

  <main class="login__main">
    <form class="login__card" (submit)="onSubmit($event)" (input)="error.set(null)">
      <span class="login__brand">[OJ]</span>
      <h1 class="login__title">Panel de staff</h1>
      <p class="login__subtitle">Juez Virtual · CUValles</p>

      @if (error()) {
        <oj-alert tone="error">{{ error() }}</oj-alert>
      }

      <oj-form-field label="Correo electrónico" for="email">
        <input id="email" type="email" autocomplete="username" [formField]="loginForm.email" />
      </oj-form-field>

      <oj-form-field label="Contraseña" for="password">
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          [formField]="loginForm.password"
        />
      </oj-form-field>

      <button ojButton variant="primary" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>

    <p class="login__foot">Los equipos inician sesión desde la app del competidor.</p>
  </main>
</div>
