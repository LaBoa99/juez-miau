<div class="pw">
  <aside class="pw__list">
    <header class="pw__list-head">Problemas de {{ code() }}</header>

    <div class="pw__list-body">
      @if (bus.loading()) {
        <p class="pw__muted">Cargando…</p>
      } @else if (bus.error()) {
        <p class="pw__muted">No se pudieron cargar los problemas.</p>
      } @else {
        @for (g of groups(); track g.category.id) {
          @let open = isOpen(g.category.id);
          <div class="pw__group">
            <button
              type="button"
              class="pw__group-name"
              [attr.aria-expanded]="open"
              [attr.aria-controls]="'pw-cat-' + g.category.id"
              (click)="toggle(g.category.id)"
            >
              <svg class="pw__chevron" [class.pw__chevron--open]="open" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M6 4l4 4-4 4" />
              </svg>
              <span class="pw__group-label">{{ g.category.name }}</span>
              <span class="pw__group-count oj-mono">{{ g.problems.length }}</span>
            </button>
            <div class="pw__group-items" [id]="'pw-cat-' + g.category.id" [hidden]="!open">
            @for (p of g.problems; track p.id) {
              <button
                type="button"
                class="pw__item"
                [class.pw__item--active]="selected() === (p.id + '')"
                [attr.aria-current]="selected() === (p.id + '') ? 'true' : null"
                (click)="selectProblem(p.id)"
              >
                <span class="pw__letter oj-mono">{{ p.letter }}</span>
                <span class="pw__title">{{ p.title }}</span>
                <oj-badge [tone]="statusTone(p.status)">{{ statusLabel(p.status) }}</oj-badge>
              </button>
            } @empty {
              <p class="pw__empty">Sin problemas</p>
            }
            </div>
          </div>
        }
      }
    </div>

    <div class="pw__list-foot">
      <button ojButton variant="secondary" type="button" (click)="selectNew()">+ Nuevo problema</button>
    </div>
  </aside>

  <section class="pw__panel">
    <router-outlet />
  </section>
</div>

<oj-confirm-dialog
  title="Cambios sin guardar"
  message="Tienes cambios sin guardar. ¿Descartarlos?"
  confirmLabel="Descartar"
  [danger]="true"
  (confirmed)="discardAndContinue()"
/>
