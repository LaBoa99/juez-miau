# Juez Miau en una sola máquina. Ver deploy/README.md.
#
#   Instalar: deploy/instalar.sh  (o: cp .env.example .env, editarlo y "docker compose up -d")
#   Actualizar: docker compose pull && docker compose up -d
#
# Solo "web" publica puertos. La configuración vive en las imágenes; el .env lleva URL y secretos.
# En el repo, docker-compose.override.yml agrega el build local y los puertos de desarrollo.
name: concurso

services:
  postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-concurso}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE:-concurso_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Solo la ve la red interna de Docker: no lleva contraseña
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  api:
    image: ghcr.io/laboa99/concurso-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    depends_on: [postgres, redis]

  # Juez: corre cada envío en un contenedor aparte
  worker:
    image: ghcr.io/laboa99/concurso-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    command: worker
    volumes:
      # Para crear los contenedores de los envíos con el Docker de esta máquina
      - /var/run/docker.sock:/var/run/docker.sock
      # Código y casos de cada envío; misma ruta aquí y en la máquina
      - /var/lib/concurso/submissions:/var/lib/concurso/submissions
    depends_on: [api]

  # Panel de staff + proxy a la API (Caddy)
  web:
    image: ghcr.io/laboa99/concurso-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
    depends_on: [api]

volumes:
  postgres_data:
  redis_data:
  caddy_data:
